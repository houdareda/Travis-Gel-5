    <style>
      @font-face {
        font-family: mainFont;
        src: local("mainFont"), url("css/mainFont.ttf");
      }

      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        direction: rtl;
      }

      body,
      html {
        font-family: mainFont, sans-serif;
      }

      a {
        text-decoration: none;
      }

      img {
        width: 100%;
        display: block;
      }

      .div_btn {
        text-align: center;
      }

      .div_btn .btn {
        font-family: mainFont, sans-serif;
        font-size: 24px;
        padding: 1px 38px 5px;
        line-height: 1.5;
        color: #242424;
        border-radius: 20px;
        box-shadow: 0 5px 15px #5858586b;
        cursor: pointer;
        line-height: 1;
      }

      .div_btn .btn span {
        color: #d5d5d5;
      }

      /* Start Thanks Page Section */
      body.thanks_page_page {
        background: url(images/thanks-2.webp) center/cover;
        min-height: 100vh;
        position: relative;
        height: 100vh;
      }

      .thanks_page {
        position: absolute;
        top: 35%;
        right: 2%;
        padding-top: 30px;
      }

      .thanks_page h3 {
        font-size: 9vw;
        color: #fcfefe;
        width: 100%;
        margin: 0 auto;
        border-radius: 10px;
        padding: 0px 11px 2px 8px;
        text-align: right;
        line-height: 1.3;
      }

      .thanks_page h4 {
        background: linear-gradient(#f32617, #9d1810);
        color: #fff;
        text-align: center;
        font-size: 9vw;
        border-radius: 15px;
        line-height: 1.4;
        padding: 0 0 6px;
        margin-top: 10px;
      }

      .thanks_page_page p {
        font-size: 4.5vw;
        color: #fff;
        background: #010103;
        width: max-content;
        margin: 0 auto 15px;
        padding: 1px 8px 3px 8px;
        border-radius: 10px;
        border: 1px solid #fff;
        position: absolute;
        bottom: 3%;
        left: 50%;
        transform: translateX(-50%);
      }

      .thanks_page .text {
        position: relative;
        width: max-content;
      }

      .thanks_page .div_btn {
        margin-top: 35px;
      }

      .thanks_page .div_btn a {
        background: linear-gradient( #fff, #fcfefe);
      }

      .thanks_page .text .img_check {
        width: 100px;
        margin: 0 auto 10px;
      }

      /* ==========  Responsive Design  ========== */
      @media (min-width: 600px) {
        body.thanks_page_page {
          background: #313131;
          min-height: 100vh;
        }
      }

      @media (min-width: 992px) {
        .thanks_page p {
          font-size: 18px;
          margin-bottom: 25px;
        }

        .thanks_page h3 {
          font-size: 25px;
          margin: 0px auto 8px;
        }

        .thanks_page .text img {
          width: 100px;
        }
      }
    </style>
  </head>

  <body class="thanks_page_page">
          <p>سيقوم احد ممثلي خدمة العملاء بالتواصل معك</p>
    <div class="thanks_page">
      <div class="text">
        <img
          class="img_check"
          src="images/mark.webp"
          alt="علامة صح تأكيد تسجيل طلب ترافيس جيل بنجاح"
        />
        <h3>
          تــــــم تسجيـــل <br />
          طلبكم للمنتج
        </h3>
        <h4>بنجاح</h4>
      </div>


      <div class="div_btn">
        <a href="index.html" class="btn">الرجوع للموقع</a>
      </div>
    </div>
  </body>
